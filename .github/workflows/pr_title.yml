name: PR title

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install commitlint-rs
        run: cargo install --quiet --locked commitlint-rs
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Match raw-crypto's release-plz and Dependabot exceptions.
          if printf '%s\n' "$PR_TITLE" | grep -Eq '^chore(\(.*\))?: release |^chore: release|^chore(\(deps\))?: bump |^update: (update|bump) '; then
            echo "Accepted automated release or dependency update title."
            exit 0
          fi

          # Otherwise require an unscoped type from .commitlintrc.yml,
          # a capitalized description, and no trailing period or space.
          # commitlint trims its input before checking the description.
          if [[ "$PR_TITLE" == *" " ]]; then
            echo "::error::PR titles must not end with a space."
            exit 1
          fi
          printf '%s\n' "$PR_TITLE" | commitlint -g .commitlintrc.yml
